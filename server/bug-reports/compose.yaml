services:
  reports:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      GEIST_REPORT_LISTEN: 0.0.0.0:8080
      GEIST_TRUSTED_PROXY: 172.29.17.2/32
    networks:
      reports:
        ipv4_address: 172.29.17.3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    networks:
      reports:
        ipv4_address: 172.29.17.2
networks:
  reports:
    ipam:
      config:
        - subnet: 172.29.17.0/28
volumes:
  certificates:
  caddy_config:
